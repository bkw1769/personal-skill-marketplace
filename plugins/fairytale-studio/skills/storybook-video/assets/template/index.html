<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>동화 영상</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
  :root { --paper: #f3efe6; --ink: #2b2420; --accent: #ee8f7a; --bar: rgba(43, 36, 32, 0.78); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #1d1a17; color: var(--paper); font-family: "Gaegu", "Apple SD Gothic Neo", sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; }
  canvas { width: min(100vw, calc(100vh * 16 / 9)); height: auto; aspect-ratio: 16 / 9; display: block; background: var(--paper); box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  #start { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(29, 26, 23, 0.55); z-index: 3; }
  #start button { font: 700 40px "Gaegu", sans-serif; color: var(--ink); background: var(--paper); border: 3px solid var(--ink); border-radius: 46% 54% 48% 52% / 60% 45% 55% 40%; padding: 18px 54px; cursor: pointer; box-shadow: 4px 5px 0 var(--accent); }
  #start button.small { font-size: 22px; padding: 8px 24px; box-shadow: 3px 3px 0 #9cc9dc; }
  #start button:disabled { opacity: .6; cursor: wait; }
  #start p { margin: 14px 0 0; text-align: center; font-size: 20px; opacity: .85; }
  #bar { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); width: min(960px, calc(100vw - 32px)); display: flex; gap: 10px; align-items: center; background: var(--bar); padding: 8px 12px; border-radius: 14px; z-index: 2; opacity: 0; transition: opacity .3s; }
  body:hover #bar, #bar:focus-within, body.paused #bar { opacity: 1; }
  #bar button { font: 700 18px "Gaegu", sans-serif; background: var(--paper); color: var(--ink); border: 0; border-radius: 9px; padding: 6px 12px; cursor: pointer; white-space: nowrap; }
  #bar button.on { background: var(--accent); }
  #seek { flex: 1; accent-color: var(--accent); min-width: 60px; }
  #time { font-size: 18px; min-width: 92px; text-align: right; font-variant-numeric: tabular-nums; }
  #rec { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); background: #b23a2a; color: #fff; padding: 6px 14px; border-radius: 10px; font-size: 20px; display: none; z-index: 4; }
  @media (max-width: 640px) { #bar { flex-wrap: wrap; } #seek { order: 9; flex-basis: 100%; } }
</style>
</head>
<body class="paused">
<div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div>
<div id="start"><div><button id="go" disabled>준비 중...</button><p id="length">소리를 켜고 보세요</p><p><button id="save2" class="small">영상 파일로 저장</button></p></div></div>
<div id="rec">녹화 중 · 끝까지 재생됩니다</div>
<div id="bar">
  <button id="play">재생</button>
  <input id="seek" type="range" min="0" max="1" step="0.05" value="0" aria-label="재생 위치">
  <span id="time">0:00</span>
  <button id="voice" title="브라우저 음성으로 이야기를 읽어 줍니다">내레이션</button>
  <button id="save" title="영상과 소리를 파일로 저장합니다(실시간으로 끝까지 재생)">영상 저장</button>
  <button id="export" title="프레임을 하나씩 그려 정확한 영상 파일을 만듭니다(실시간이 아니라 컴퓨터 부하와 무관)">정밀 저장</button>
  <button id="full">전체 화면</button>
</div>
<script type="module" src="./js/main.js"></script>
</body>
</html>
