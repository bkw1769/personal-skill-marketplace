[project]
name = "fairytale-tts"
version = "0.1.0"
description = "Local Qwen3-TTS (MLX) voice design and cloning for the fairytale project."
requires-python = ">=3.12,<3.13"
dependencies = [
    "mlx-audio==0.5.8",
]

[project.scripts]
fairytale-tts = "fairytale_tts.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fairytale_tts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=fairytale_tts --cov-branch --cov-report=term-missing --cov-fail-under=100"
